<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none" role="img" aria-label="Technical line drawing of a house floor plan">
  <title>House floor plan — technical drawing</title>
  <desc>Blueprint style line art of a residential floor plan with walls, door swings, windows, dimension lines, hatching, a north arrow and a scale bar.</desc>

  <g stroke="#ffffff" stroke-width="2" stroke-linecap="square" vector-effect="non-scaling-stroke">

    <!-- Outer walls (double line) -->
    <path d="M300 200 H1180 V700 H300 Z" stroke-width="3" />
    <path d="M330 230 H1150 V670 H330 Z" stroke-width="1.5" stroke-opacity="0.75" />

    <!-- Internal partitions -->
    <path d="M330 470 H740 M740 230 V670" stroke-width="2.5" />
    <path d="M740 470 H1150" stroke-width="1.5" stroke-opacity="0.55" />
    <path d="M920 230 V470" stroke-width="2" />
    <path d="M330 560 H520" stroke-width="2" />

    <!-- Door swings -->
    <g stroke-width="1.5" stroke-opacity="0.8">
      <path d="M740 380 V320" />
      <path d="M740 320 a 60 60 0 0 1 60 60" />
      <path d="M330 470 h 60" />
      <path d="M390 470 a 60 60 0 0 0 -60 -60" />
      <path d="M920 300 V240" />
      <path d="M920 240 a 60 60 0 0 1 60 60" />
      <path d="M520 560 v -50" />
      <path d="M520 510 a 50 50 0 0 0 -50 50" />
    </g>

    <!-- Windows -->
    <g stroke-width="3">
      <path d="M420 200 H620" /><path d="M420 230 H620" stroke-opacity="0.6" />
      <path d="M820 200 H1020" /><path d="M820 230 H1020" stroke-opacity="0.6" />
      <path d="M1180 320 H1150" /><path d="M1150 320 V480" stroke-opacity="0.6" />
      <path d="M300 600 H330" /><path d="M300 600 V660" stroke-opacity="0.6" />
      <path d="M600 700 H740" /><path d="M600 670 H740" stroke-opacity="0.6" />
    </g>

    <!-- Fittings -->
    <g stroke-width="1.5" stroke-opacity="0.6">
      <path d="M420 560 H480 V620 H420 Z" />
      <path d="M860 560 H920 V620 H860 Z" />
      <path d="M980 300 H1110 V420 H980 Z" />
      <path d="M980 300 l130 120 M1110 300 l-130 120" stroke-opacity="0.35" />
    </g>

    <!-- Wall hatching -->
    <g stroke-width="1.5" stroke-opacity="0.45">
      <path d="M300 200 l30 30 M340 200 l30 30 M380 200 l30 30 M420 200 l30 30 M460 200 l30 30 M500 200 l30 30 M540 200 l30 30 M580 200 l30 30 M620 200 l30 30 M660 200 l30 30 M700 200 l30 30 M740 200 l30 30 M780 200 l30 30 M820 200 l30 30 M860 200 l30 30 M900 200 l30 30 M940 200 l30 30 M980 200 l30 30 M1020 200 l30 30 M1060 200 l30 30 M1100 200 l30 30 M1140 200 l30 30" />
    </g>

    <!-- Dimension lines -->
    <g stroke-width="1.5" stroke-opacity="0.7">
      <path d="M300 760 H1180" />
      <path d="M300 750 V770 M1180 750 V770" />
      <path d="M300 752 l20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M1180 752 l-20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M240 200 V700" />
      <path d="M230 200 H250 M230 700 H250" />
      <path d="M234 206 l-6 20 h12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M234 694 l-6 -20 h12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M740 700 V810" stroke-dasharray="10 8" stroke-opacity="0.5" />
    </g>

    <!-- North arrow -->
    <g stroke-width="2" stroke-opacity="0.8">
      <circle cx="1330" cy="250" r="52" />
      <path d="M1330 198 L1352 258 L1330 242 L1308 258 Z" />
      <path d="M1330 198 V242" />
      <path d="M1330 150 V176" />
    </g>

    <!-- Scale bar -->
    <g stroke-width="2" stroke-opacity="0.8">
      <path d="M1240 700 H1440" />
      <path d="M1240 690 V710 M1340 690 V710 M1440 690 V710" />
      <path d="M1240 700 h50 v10 h-50 Z" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <path d="M1340 700 h50 v10 h-50 Z" stroke-opacity="0.6" />
    </g>

    <!-- Annotation block -->
    <g stroke-width="1.5" stroke-opacity="0.55">
      <path d="M120 260 H420" />
      <path d="M120 284 H320" />
      <path d="M120 308 H380" />
      <path d="M120 332 H240" />
      <circle cx="120" cy="260" r="5" /><circle cx="120" cy="284" r="5" />
      <circle cx="120" cy="308" r="5" /><circle cx="120" cy="332" r="5" />
    </g>
  </g>
</svg>
