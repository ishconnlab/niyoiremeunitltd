<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none" role="img" aria-label="Technical line drawing of an excavator and trench section">
  <title>Excavator and trench section — technical drawing</title>
  <desc>Blueprint style line art of a tracked excavator with boom, arm and bucket working in a trench, with soil hatching, dimension lines and a section marker.</desc>

  <g stroke="#ffffff" stroke-width="2" stroke-linecap="square" vector-effect="non-scaling-stroke">

    <!-- Ground / soil line -->
    <path d="M60 420 H1540" stroke-width="3" />
    <path d="M60 420 V780 H1540" stroke-width="3" />
    <path d="M900 420 V780" stroke-width="3" />

    <!-- Trench -->
    <path d="M900 420 L1120 500 V780 H900 Z" stroke-width="2.5" />
    <path d="M1120 500 L1200 440" stroke-opacity="0.6" />

    <!-- Soil hatching -->
    <g stroke-width="1.5" stroke-opacity="0.45">
      <path d="M100 460 l30 -30 M170 460 l30 -30 M240 460 l30 -30 M310 460 l30 -30 M380 460 l30 -30 M450 460 l30 -30 M520 460 l30 -30 M590 460 l30 -30 M660 460 l30 -30 M730 460 l30 -30 M800 460 l30 -30" />
      <path d="M120 520 l30 -30 M200 520 l30 -30 M280 520 l30 -30 M360 520 l30 -30 M440 520 l30 -30 M520 520 l30 -30 M600 520 l30 -30 M680 520 l30 -30 M760 520 l30 -30 M840 520 l30 -30" />
      <path d="M140 580 l30 -30 M220 580 l30 -30 M300 580 l30 -30 M380 580 l30 -30 M460 580 l30 -30 M540 580 l30 -30 M620 580 l30 -30 M700 580 l30 -30 M780 580 l30 -30" />
      <path d="M100 640 l30 -30 M180 640 l30 -30 M260 640 l30 -30 M340 640 l30 -30 M420 640 l30 -30 M500 640 l30 -30 M580 640 l30 -30 M660 640 l30 -30 M740 640 l30 -30 M820 640 l30 -30" />
      <path d="M140 700 l30 -30 M220 700 l30 -30 M300 700 l30 -30 M380 700 l30 -30 M460 700 l30 -30 M540 700 l30 -30 M620 700 l30 -30 M700 700 l30 -30 M780 700 l30 -30" />
      <path d="M940 540 l30 -30 M940 600 l30 -30 M940 660 l30 -30 M940 720 l30 -30" />
    </g>

    <!-- Tracks -->
    <path d="M300 400 H720 V470 H300 Z" stroke-width="3" />
    <g stroke-width="1.5" stroke-opacity="0.65">
      <circle cx="340" cy="435" r="24" /><circle cx="410" cy="435" r="16" />
      <circle cx="480" cy="435" r="16" /><circle cx="550" cy="435" r="16" />
      <circle cx="620" cy="435" r="16" /><circle cx="680" cy="435" r="24" />
      <path d="M300 400 l-24 -24 M300 470 l-24 24 M720 400 l24 -24 M720 470 l24 24" />
    </g>

    <!-- Car body and cab -->
    <path d="M360 400 V300 H640 V400" stroke-width="3" />
    <path d="M360 300 H420 V400 H360" stroke-width="2" />
    <path d="M392 320 H560 V380 H392 Z" stroke-width="2" stroke-opacity="0.75" />
    <path d="M392 350 H560" stroke-width="1.5" stroke-opacity="0.55" />
    <path d="M620 320 H700 V400 H620" stroke-width="2" stroke-opacity="0.8" />
    <path d="M700 340 H760 V400 H700" stroke-width="2" stroke-opacity="0.8" />

    <!-- Counterweight -->
    <path d="M300 300 H360 V400 H300 Z" stroke-width="2.5" />
    <path d="M312 320 H348 M312 340 H348 M312 360 H348" stroke-opacity="0.5" />

    <!-- Boom, arm and bucket -->
    <path d="M700 330 L880 210 L1010 320" stroke-width="4" />
    <path d="M712 344 L880 240 L1000 336" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="880" cy="250" r="14" stroke-width="2" />
    <path d="M1010 320 L1060 460 L990 520" stroke-width="4" />
    <circle cx="1035" cy="390" r="12" stroke-width="2" />
    <path d="M990 520 L930 560 L900 520 L930 480 Z" stroke-width="2.5" />
    <path d="M900 520 L872 536 M930 560 l-30 16" stroke-opacity="0.7" />

    <!-- Hydraulic rams -->
    <g stroke-width="2" stroke-opacity="0.8">
      <path d="M740 320 L860 240" />
      <path d="M760 336 L868 258" stroke-opacity="0.5" />
      <path d="M1000 340 L1040 430" />
      <path d="M1016 352 L1052 434" stroke-opacity="0.5" />
    </g>

    <!-- Bucket in the trench -->
    <path d="M980 560 L1120 600 L1090 660 L950 620 Z" stroke-width="2.5" />
    <path d="M1090 660 l26 12 M1050 672 l24 12" stroke-opacity="0.7" />

    <!-- Dimension lines -->
    <g stroke-width="1.5" stroke-opacity="0.7">
      <path d="M300 840 H720" />
      <path d="M300 830 V850 M720 830 V850" />
      <path d="M300 832 l20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M720 832 l-20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M900 420 V240" stroke-dasharray="10 8" stroke-opacity="0.5" />
      <path d="M880 240 H1120" />
      <path d="M880 230 V250 M1120 230 V250" />
    </g>

    <!-- Section marker -->
    <g stroke-width="2" stroke-opacity="0.8">
      <circle cx="1300" cy="620" r="70" />
      <path d="M1300 560 l70 60 M1300 560 l-70 60" stroke-opacity="0.6" />
    </g>
  </g>
</svg>
