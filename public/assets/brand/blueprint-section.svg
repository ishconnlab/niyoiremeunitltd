<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none" role="img" aria-label="Technical section drawing through a two storey house">
  <title>House section — technical drawing</title>
  <desc>Blueprint style line art of a cross section through a two storey house showing foundations, ground and first floor slabs, walls, roof, stair, levels and elevation markers.</desc>

  <g stroke="#ffffff" stroke-width="2" stroke-linecap="square" vector-effect="non-scaling-stroke">

    <!-- Ground line -->
    <path d="M40 760 H1160" stroke-width="3" />
    <g stroke-width="1.5" stroke-opacity="0.5">
      <path d="M80 760 l-24 26" /><path d="M180 760 l-24 26" /><path d="M280 760 l-24 26" />
      <path d="M380 760 l-24 26" /><path d="M480 760 l-24 26" /><path d="M580 760 l-24 26" />
      <path d="M680 760 l-24 26" /><path d="M780 760 l-24 26" /><path d="M880 760 l-24 26" />
      <path d="M980 760 l-24 26" /><path d="M1080 760 l-24 26" />
    </g>

    <!-- Foundations -->
    <path d="M220 760 V820 H360 M840 760 V820 H980" stroke-width="2.5" />
    <path d="M240 820 H340 M860 820 H960" stroke-width="1.5" stroke-opacity="0.55" />
    <g stroke-width="1.5" stroke-opacity="0.4">
      <path d="M250 780 l-24 24 M290 780 l-24 24 M870 780 l-24 24 M910 780 l-24 24" />
    </g>

    <!-- Ground floor slab -->
    <path d="M200 740 H1000" stroke-width="3" />
    <path d="M200 760 H1000" stroke-width="1.5" stroke-opacity="0.6" />
    <g stroke-width="1.5" stroke-opacity="0.4">
      <path d="M240 740 l-18 20 M320 740 l-18 20 M400 740 l-18 20 M480 740 l-18 20 M560 740 l-18 20 M640 740 l-18 20 M720 740 l-18 20 M800 740 l-18 20 M880 740 l-18 20" />
    </g>

    <!-- Walls -->
    <path d="M220 740 V470 M980 740 V470" stroke-width="3" />
    <path d="M240 740 V470 M960 740 V470" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- First floor slab -->
    <path d="M200 470 H1000" stroke-width="3" />
    <path d="M200 450 H1000" stroke-width="1.5" stroke-opacity="0.6" />
    <g stroke-width="1.5" stroke-opacity="0.4">
      <path d="M260 450 l-18 20 M340 450 l-18 20 M420 450 l-18 20 M500 450 l-18 20 M580 450 l-18 20 M660 450 l-18 20 M740 450 l-18 20 M820 450 l-18 20 M900 450 l-18 20" />
    </g>

    <!-- Upper walls and roof -->
    <path d="M220 450 V330 M980 450 V330" stroke-width="3" />
    <path d="M220 330 L600 150 L980 330" stroke-width="3" />
    <path d="M250 330 L600 180 L950 330" stroke-width="1.5" stroke-opacity="0.55" />

    <!-- Roof truss hint -->
    <path d="M340 330 L600 190 L860 330" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M340 330 H860" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M470 330 L600 190 L730 330" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Internal partitions and openings -->
    <path d="M420 740 V520 M780 740 V520" stroke-width="2" />
    <path d="M420 470 V400 M780 470 V400" stroke-width="2" />
    <path d="M460 740 V640 H580 V740" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M820 740 V600 H920 V740" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Stair -->
    <path d="M520 740 h60 v-30 h60 v-30 h60 v-30 h60 v-30" stroke-width="2" />
    <path d="M520 740 L740 590" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="12 10" />

    <!-- Levels with elevation markers -->
    <g stroke-width="1.5" stroke-opacity="0.7">
      <path d="M60 740 H180" stroke-dasharray="8 8" />
      <path d="M60 470 H180" stroke-dasharray="8 8" />
      <path d="M60 330 H180" stroke-dasharray="8 8" />
      <path d="M96 740 l-16 0 8 -14 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M96 470 l-16 0 8 -14 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M96 330 l-16 0 8 -14 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
    </g>

    <!-- Vertical dimension -->
    <g stroke-width="1.5" stroke-opacity="0.7">
      <path d="M1040 760 V330" />
      <path d="M1030 760 H1050 M1030 470 H1050 M1030 330 H1050" />
      <path d="M1034 754 l-6 18 h12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M1034 336 l-6 -18 h12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
    </g>

    <!-- Annotation block -->
    <g stroke-width="1.5" stroke-opacity="0.55">
      <path d="M120 140 H380" />
      <path d="M120 164 H300" />
      <path d="M120 188 H340" />
      <path d="M120 212 H260" />
      <circle cx="120" cy="140" r="5" /><circle cx="120" cy="164" r="5" />
      <circle cx="120" cy="188" r="5" /><circle cx="120" cy="212" r="5" />
    </g>
  </g>
</svg>
