<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none" role="img" aria-label="Technical line drawing of a roof truss structure">
  <title>Roof truss structure — technical drawing</title>
  <desc>Blueprint style line art of a timber and steel roof structure showing trusses, purlins, tie beams, bracing and dimension lines.</desc>

  <g stroke="#ffffff" stroke-width="2" stroke-linecap="square" vector-effect="non-scaling-stroke">

    <!-- Ground line -->
    <path d="M60 780 H1540" stroke-width="3" />
    <g stroke-width="1.5" stroke-opacity="0.5">
      <path d="M100 780 l-24 26" /><path d="M220 780 l-24 26" /><path d="M340 780 l-24 26" />
      <path d="M460 780 l-24 26" /><path d="M580 780 l-24 26" /><path d="M700 780 l-24 26" />
      <path d="M820 780 l-24 26" /><path d="M940 780 l-24 26" /><path d="M1060 780 l-24 26" />
      <path d="M1180 780 l-24 26" /><path d="M1300 780 l-24 26" /><path d="M1420 780 l-24 26" />
    </g>

    <!-- Wall plates -->
    <path d="M220 780 V620" stroke-width="3" />
    <path d="M1380 780 V620" stroke-width="3" />
    <path d="M200 620 H240 M1360 620 H1400" stroke-opacity="0.7" />

    <!-- Gable outline -->
    <path d="M220 620 L800 300 L1380 620" stroke-width="3" />
    <path d="M260 620 L800 340 L1340 620" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Trusses -->
    <g stroke-width="2">
      <path d="M400 620 V470 M400 470 L800 300 L400 470 H1200 M400 470 V620" />
      <path d="M600 620 V400 M600 400 L800 300 L600 400 H1000 M600 400 V620" />
      <path d="M800 620 V300" />
      <path d="M1000 620 V400 M1000 400 L800 300 L1000 400 H600 M1000 400 V620" />
      <path d="M1200 620 V470 M1200 470 L800 300 L1200 470 H400 M1200 470 V620" />
    </g>

    <!-- Web members -->
    <g stroke-width="1.5" stroke-opacity="0.6">
      <path d="M400 470 L600 400 M600 400 L800 300 M1000 400 L800 300 M1200 470 L1000 400" />
      <path d="M400 550 H600 M600 550 H800 M800 550 H1000 M1000 550 H1200" />
      <path d="M400 550 L400 470 M600 550 L600 400 M1000 550 L1000 400 M1200 550 L1200 470" />
      <path d="M500 470 L500 620 M700 400 L700 620 M900 400 L900 620 M1100 470 L1100 620" stroke-opacity="0.4" />
    </g>

    <!-- Purlins -->
    <g stroke-width="1.5" stroke-opacity="0.55">
      <path d="M310 560 L800 240 L1290 560" />
      <path d="M400 500 L800 270 L1200 500" />
      <path d="M490 440 L800 300 L1110 440" />
    </g>

    <!-- Bracing -->
    <g stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="12 10">
      <path d="M400 620 L800 300 M1200 620 L800 300" />
      <path d="M220 660 H1380" />
    </g>

    <!-- Dimension lines -->
    <g stroke-width="1.5" stroke-opacity="0.7">
      <path d="M220 830 H1380" />
      <path d="M220 820 V840 M1380 820 V840" />
      <path d="M220 822 l20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M1380 822 l-20 -6 v12 Z" fill="#ffffff" fill-opacity="0.7" stroke="none" />
      <path d="M800 300 V170" stroke-dasharray="10 8" stroke-opacity="0.5" />
      <path d="M220 170 H1380" />
      <path d="M220 160 V180 M1380 160 V180" />
    </g>

    <!-- Annotation block -->
    <g stroke-width="1.5" stroke-opacity="0.55">
      <path d="M90 300 H330" />
      <path d="M90 324 H250" />
      <path d="M90 348 H300" />
      <circle cx="90" cy="300" r="5" /><circle cx="90" cy="324" r="5" /><circle cx="90" cy="348" r="5" />
    </g>
  </g>
</svg>
