    <!-- Boot splash: paints before the app bundle arrives so the page never
         flashes white. It is removed by src/main.tsx once React takes over. -->
    <style>
      html,
      body {
        background: #0b1b3d;
      }

      body.app-ready {
        background: #f8fafc;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        background-color: #0b1b3d;
        transition:
          opacity 400ms ease,
          visibility 400ms ease;
      }

      #app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* The drawing stays clearly visible, softened just enough that the
         logo, name and progress bar remain easy to read. */
      #app-loader .splash-bg {
        position: absolute;
        inset: -24px;
        background: url('/assets/brand/loader-blueprint.svg') center / cover no-repeat;
        filter: blur(3px);
        opacity: 0.55;
      }

      #app-loader .splash-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(11, 27, 61, 0.72) 0%,
          rgba(11, 27, 61, 0.84) 55%,
          rgba(11, 27, 61, 0.96) 100%
        );
      }

      #app-loader .splash-panel {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100%;
        max-width: 360px;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        background: rgba(11, 27, 61, 0.5);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }

      #app-loader .splash-logo {
        width: 190px;
        height: auto;
        animation: splash-lift 3.4s ease-in-out infinite;
      }

      #app-loader .splash-name {
        margin: 0;
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #ffffff;
        text-align: center;
      }

      #app-loader .splash-slogan {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-style: italic;
        font-weight: 600;
        font-size: 13px;
        color: #ff5b00;
        text-align: center;
      }

      #app-loader .splash-track {
        position: relative;
        width: 176px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      #app-loader .splash-track::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        border-radius: 999px;
        background: #ff5b00;
        animation: splash-progress 1.15s ease-in-out infinite;
      }

      @keyframes splash-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(240%);
        }
      }

      @keyframes splash-lift {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader .splash-logo,
        #app-loader .splash-track::after {
          animation: none;
        }

        #app-loader .splash-track::after {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="app-loader" role="status" aria-live="polite" aria-label="NIYO IREME UNIT LTD">
